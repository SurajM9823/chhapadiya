{% extends "panel/base.html" %}
{% block title %} — Forgot Password{% endblock %}
{% block login_content %}
<div class="max-w-sm mx-auto mt-20 bg-white rounded-xl shadow p-8">
    <h1 class="text-2xl font-bold mb-6 text-center">Forgot Password</h1>
    <p class="text-sm text-gray-600 mb-4 text-center">Enter your email to receive an OTP</p>
    
    <!-- Error Message -->
    <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded text-sm text-red-600"></div>
    
    <!-- Success Message -->
    <div id="successMessage" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded text-sm text-green-600"></div>
    
    <form id="forgotPasswordForm" class="space-y-4">
        {% csrf_token %}
        <input id="emailInput" name="email" type="email" placeholder="Email Address" required
            class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        <button type="submit" id="submitBtn" class="w-full bg-gray-900 text-white py-2 rounded text-sm hover:bg-gray-700 transition-colors">
            <span id="btnText">Send OTP</span>
            <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 mx-auto" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </form>
    <div class="mt-4 text-center">
        <a href="{% url 'panel_login' %}" class="text-sm text-blue-600 hover:text-blue-800">Back to Login</a>
    </div>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const emailInput = document.getElementById('emailInput');
    
    // Hide previous messages
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    
    // Disable button and show spinner
    submitBtn.disabled = true;
    btnText.classList.add('hidden');
    btnSpinner.classList.remove('hidden');
    
    const formData = new FormData();
    formData.append('email', emailInput.value);
    formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));
    
    try {
        const response = await fetch('{% url "panel_forgot_password" %}', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            successDiv.textContent = data.message;
            successDiv.classList.remove('hidden');
            
            // Redirect to OTP verification page after 1 second
            setTimeout(() => {
                window.location.href = '{% url "panel_verify_otp" %}';
            }, 1000);
        } else {
            errorDiv.textContent = data.error;
            errorDiv.classList.remove('hidden');
            
            // Re-enable button
            submitBtn.disabled = false;
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
        }
    } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
        
        // Re-enable button
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
    }
});
</script>
{% endblock %}
