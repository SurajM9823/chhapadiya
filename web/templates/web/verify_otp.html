{% extends 'web/base.html' %}
{% load static %}

{% block title %}Verify OTP | Chhapadiya Traders{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 bg-gray-50">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Verify OTP</h1>
            <p class="text-sm text-gray-600">Enter the OTP sent to</p>
            <p class="text-sm font-semibold text-emerald-600">{{ email }}</p>
        </div>
        
        <!-- Error Message -->
        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600"></div>
        
        <!-- Success Message -->
        <div id="successMessage" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-600"></div>
        
        <form id="verifyOtpForm" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2 text-center">Enter 6-Digit OTP</label>
                <input id="otpInput" name="otp" type="text" placeholder="000000" maxlength="6" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-4 text-center text-3xl tracking-widest font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg text-sm transition-colors">
                <span id="btnText">Verify OTP</span>
                <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 mx-auto" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
        
        <div class="mt-6 text-center space-y-2">
            <a href="{% url 'customer_forgot_password' %}" class="block text-sm text-emerald-600 hover:text-emerald-700 font-medium">Resend OTP</a>
            <a href="{% url 'index' %}" class="block text-sm text-gray-500 hover:text-gray-700">Cancel</a>
        </div>
    </div>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

document.getElementById('verifyOtpForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const otpInput = document.getElementById('otpInput');
    
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    
    submitBtn.disabled = true;
    btnText.classList.add('hidden');
    btnSpinner.classList.remove('hidden');
    
    const formData = new FormData();
    formData.append('otp', otpInput.value);
    formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));
    
    try {
        const response = await fetch('{% url "customer_verify_otp" %}', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            successDiv.textContent = 'OTP verified successfully! Redirecting...';
            successDiv.classList.remove('hidden');
            
            setTimeout(() => {
                window.location.href = '{% url "customer_reset_password" %}';
            }, 1000);
        } else {
            errorDiv.textContent = data.error;
            errorDiv.classList.remove('hidden');
            
            submitBtn.disabled = false;
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
            
            otpInput.value = '';
            otpInput.focus();
        }
    } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
        
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
    }
});

// Auto-focus OTP input
document.getElementById('otpInput').focus();
</script>
{% endblock %}
